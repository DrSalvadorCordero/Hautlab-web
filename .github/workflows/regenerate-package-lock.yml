name: Regenerate package lock

on:
  push:
    branches: [fix/production-alias-gate]
    paths:
      - hautlab-web-ready/package.json
      - .github/workflows/regenerate-package-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hautlab-web-ready
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/production-alias-gate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hautlab-web-ready/package-lock.json

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock for NanoID 3.3.18"
          git push origin HEAD:fix/production-alias-gate
