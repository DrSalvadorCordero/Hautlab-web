name: One-time Next.js security lockfile refresh
on:
  push:
    branches:
      - security/next-15-5-28-20261024
permissions:
  contents: write
jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, 'bootstrap next security lock')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hautlab-web-ready/package-lock.json
      - name: Upgrade patched Next.js and refresh reproducible lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd hautlab-web-ready
          npm install --package-lock-only --ignore-scripts --save-exact next@15.5.28
          npm ci --ignore-scripts
          npm run type-check
          npm audit --omit=dev --audit-level=critical
          cd ..
          git config user.name "hautlab-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hautlab-web-ready/package.json hautlab-web-ready/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): patch Next.js 15.5.28 and lock dependencies"
          git push origin HEAD:security/next-15-5-28-20261024
