name: Export HAUTLAB source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload deploy source
        uses: actions/upload-artifact@v4
        with:
          name: hautlab-web-ready-source
          path: hautlab-web-ready
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
