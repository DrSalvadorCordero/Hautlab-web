name: HAUTLAB v2 CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hautlab-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hautlab-web-ready

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hautlab-web-ready/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies for severe issues
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build Next.js
        run: npm run build

      - name: Smoke test production routes
        run: |
          set -o pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/hautlab-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/hautlab-next.log' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/ >/dev/null
          npm run smoke-test 2>&1 | tee /tmp/hautlab-smoke.log

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            /tmp/hautlab-smoke.log
            /tmp/hautlab-next.log
          if-no-files-found: ignore
          retention-days: 3
