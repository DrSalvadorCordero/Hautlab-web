name: HAUTLAB v2 CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hautlab-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hautlab-web-ready

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hautlab-web-ready/package-lock.json

      - name: Production dependency gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm audit --package-lock-only --omit=dev --audit-level=moderate

      - name: Install dependencies
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
        run: npm ci

      - name: Capture production dependency audit
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
        run: npm audit --omit=dev --json > /tmp/hautlab-audit.json || true

      - name: Capture full dependency audit for diagnostics
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
        run: npm audit --json > /tmp/hautlab-audit-all.json || true

      - name: Lint
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
        run: npm run lint

      - name: Type check
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
        run: npm run type-check

      - name: Build Next.js
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
        run: npm run build

      - name: Smoke test production routes
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
        run: |
          set -o pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/hautlab-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/hautlab-next.log' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/ >/dev/null
          npm run smoke-test 2>&1 | tee /tmp/hautlab-smoke.log

          curl -fsS -D /tmp/hautlab-og-headers -o /tmp/hautlab-og.png http://127.0.0.1:3000/opengraph-image
          grep -qi '^content-type: image/png' /tmp/hautlab-og-headers
          test -s /tmp/hautlab-og.png

          curl -fsS -L -D /tmp/hautlab-icon-headers -o /tmp/hautlab-icon.svg http://127.0.0.1:3000/favicon.ico
          grep -qi '^content-type: image/svg+xml' /tmp/hautlab-icon-headers
          grep -q '<svg' /tmp/hautlab-icon.svg

      - name: Audit production dependencies
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload diagnostics
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/v2')
        uses: actions/upload-artifact@v4
        with:
          name: hautlab-diagnostics
          path: |
            /tmp/hautlab-audit.json
            /tmp/hautlab-audit-all.json
            /tmp/hautlab-smoke.log
            /tmp/hautlab-next.log
            /tmp/hautlab-og-headers
            /tmp/hautlab-icon-headers
          if-no-files-found: ignore
          retention-days: 3
