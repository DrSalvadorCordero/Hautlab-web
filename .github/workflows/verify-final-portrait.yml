name: Verify final portrait

on:
  push:
    branches:
      - fix-final-photo-maps
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hautlab-web-ready
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hautlab-web-ready/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify portrait bytes and hash
        run: |
          test "$(stat -c%s public/visuals/dr-salvador-cordero-portrait-final.webp)" -eq 99858
          echo "f0346e0c206d4efe4b65d5f6a27c4bd7724038c4a8606d31900887bd1135c445  public/visuals/dr-salvador-cordero-portrait-final.webp" | sha256sum -c -
