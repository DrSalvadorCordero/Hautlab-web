name: Decode verified portrait from Git history

on:
  push:
    branches:
      - fix-hd-portrait-and-maps
    paths:
      - .github/workflows/decode-verified-portrait.yml

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch with history
        uses: actions/checkout@v4
        with:
          ref: fix-hd-portrait-and-maps
          fetch-depth: 0

      - name: Restore and verify full JPEG
        run: |
          set -euo pipefail
          git show 18bf18038712dac7497af50d982678b0e1be1f76:hautlab-web-ready/assets-src/portrait-hd/part00.b64 > /tmp/portrait.b64
          base64 --decode /tmp/portrait.b64 > hautlab-web-ready/public/visuals/dr-salvador-cordero-portrait-hd.jpg
          python -m pip install --quiet Pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('hautlab-web-ready/public/visuals/dr-salvador-cordero-portrait-hd.jpg')
          size = path.stat().st_size
          if size < 250000:
              raise SystemExit(f'JPEG unexpectedly small: {size} bytes')
          with Image.open(path) as image:
              image.load()
              if image.size != (1152, 1728):
                  raise SystemExit(f'Unexpected dimensions: {image.size}')
              if image.format != 'JPEG':
                  raise SystemExit(f'Unexpected format: {image.format}')
          print(f'Portrait verified: 1152x1728, {size} bytes')
          PY
          sha256sum hautlab-web-ready/public/visuals/dr-salvador-cordero-portrait-hd.jpg

      - name: Commit verified binary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hautlab-web-ready/public/visuals/dr-salvador-cordero-portrait-hd.jpg
          if git diff --cached --quiet; then
            echo 'Portrait already current.'
            exit 0
          fi
          git commit -m 'Restore verified 1152x1728 portrait binary'
          git push origin HEAD:fix-hd-portrait-and-maps
