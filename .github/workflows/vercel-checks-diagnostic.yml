name: Vercel checks diagnostic

on:
  push:
    branches: [ops/vercel-deployment-checks]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel token exists
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_MISSING"
            exit 2
          fi
          echo "VERCEL_TOKEN_PRESENT"

      - name: List deployment checks blocking aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest project checks hautlabmx.com \
            --blocks deployment-alias \
            --token "$VERCEL_TOKEN" \
            --scope dr-salvador-corderos-projects
