name: Vercel checks diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel token exists
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_MISSING" | tee /tmp/vercel-checks.txt
            exit 2
          fi
          echo "VERCEL_TOKEN_PRESENT" | tee /tmp/vercel-checks.txt

      - name: List deployment checks blocking aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          npx --yes vercel@latest project checks hautlabmx.com \
            --blocks deployment-alias \
            --token "$VERCEL_TOKEN" \
            --scope dr-salvador-corderos-projects 2>&1 | tee -a /tmp/vercel-checks.txt

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-checks-diagnostic
          path: /tmp/vercel-checks.txt
          if-no-files-found: warn
          retention-days: 1
